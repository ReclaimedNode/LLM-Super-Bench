name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # No dependencies, so there is nothing to install.
      - name: Tests (race, sweep, charts, engines, security)
        run: bun test $(find test -name '*.test.ts' | grep -v -e 'bench/merge.test' -e 'bench/shim.test' | sort)
      # Image-merge and mflux-shim tests come from the original project's benchmark suite and depend on the
      # machine they run on. They are reported, but a failure here does not fail the build.
      - name: Inherited suite tests (informational)
        continue-on-error: true
        run: bun test test/bench/merge.test.ts test/bench/shim.test.ts
